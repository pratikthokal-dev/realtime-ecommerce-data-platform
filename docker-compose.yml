services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: ecommerce-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log


  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ecommerce-kafka
    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ecommerce-kafka-init
    depends_on:
      - kafka
    volumes:
      - ./infrastructure/docker/create-kafka-topics.sh:/create-kafka-topics.sh
    entrypoint: ["/bin/bash", "/create-kafka-topics.sh"]

  debezium:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: ecommerce-debezium
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: debezium

  kafka-ui:
    image: provectuslabs/kafka-ui:latest

    container_name: ecommerce-kafka-ui

    ports:
      - "8080:8080"

    environment:

      KAFKA_CLUSTERS_0_NAME: ecommerce-cluster

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      - kafka

  spark:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.spark
    image: ecommerce-spark:4.0.1
    container_name: ecommerce-spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./:/opt/project

  spark-worker:
    image: apache/spark:4.0.1
    container_name: ecommerce-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    depends_on:
    - spark
    volumes:
      - ./:/opt/project

  spark-streaming:
    image: ecommerce-spark:4.0.1
    container_name: ecommerce-spark-streaming
    volumes:
    - ./:/opt/project
    command: >
      /opt/spark/bin/spark-submit
      --master local[*]
      --jars /opt/spark/jars/spark-sql-kafka-0-10_2.13-4.0.1.jar,/opt/spark/jars/spark-token-provider-kafka-0-10_2.13-4.0.1.jar
      /opt/project/spark/jobs/debezium_orders_streaming.py
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  airflow:
    user: "0:0"
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    image: ecommerce-airflow:2.10.5
    container_name: ecommerce-airflow
    ports:
      - "8082:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db


    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/project
      - airflow_metadata:/opt/airflow/db

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true;
      airflow scheduler &
      exec airflow webserver
      "

  trino:
    image: trinodb/trino:latest
    container_name: ecommerce-trino
    ports:
      - "8090:8080"
    volumes:
      - ./infrastructure/trino:/etc/trino
      - ./data/iceberg:/opt/project/data/iceberg
    depends_on:
      - spark

  nessie:
    image: ghcr.io/projectnessie/nessie:0.104.5
    container_name: ecommerce-nessie
    ports:
      - "19120:19120"

  spark-thrift:
    image: ecommerce-spark:4.0.1
    container_name: ecommerce-spark-thrift
    user: "0:0"
    ports:
      - "10000:10000"
    volumes:
      - .:/opt/project
    depends_on:
      - spark
      - spark-worker
    command: >
      bash -c "
      /opt/spark/sbin/start-thriftserver.sh
      --master spark://spark:7077
      --conf spark.sql.catalog.local=org.apache.iceberg.spark.SparkCatalog
      --conf spark.sql.catalog.local.type=hadoop
      --conf spark.sql.catalog.local.warehouse=/opt/project/data/iceberg
      --conf spark.sql.warehouse.dir=/opt/project/data/warehouse
      --conf spark.sql.shuffle.partitions=2
      --conf spark.driver.memory=768m
      --conf spark.executor.memory=768m
      --hiveconf hive.server2.thrift.port=10000
      --hiveconf hive.server2.thrift.bind.host=0.0.0.0;
      tail -F /opt/spark/logs/spark-root-org.apache.spark.sql.hive.thriftserver.HiveThriftServer2-*.out
      "

volumes:
  airflow_metadata:
  kafka_data:
  zookeeper_data:
  zookeeper_log:

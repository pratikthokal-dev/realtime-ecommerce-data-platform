services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"


  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ecommerce-kafka
    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"



  kafka-ui:
    image: provectuslabs/kafka-ui:latest

    container_name: ecommerce-kafka-ui

    ports:
      - "8080:8080"

    environment:

      KAFKA_CLUSTERS_0_NAME: ecommerce-cluster

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      - kafka
  
  spark:
    image: apache/spark:4.0.1
    container_name: ecommerce-spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./:/opt/project

  spark-worker:
    image: apache/spark:4.0.1
    container_name: ecommerce-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    depends_on:
    - spark
  
  spark-streaming:
    image: ecommerce-spark:4.0.1
    container_name: ecommerce-spark-streaming
    volumes:
    - ./:/opt/project
    command: >
      /opt/spark/bin/spark-submit
      --master local[*]
      --jars /opt/spark/jars/spark-sql-kafka-0-10_2.13-4.0.1.jar,/opt/spark/jars/spark-token-provider-kafka-0-10_2.13-4.0.1.jar
      /opt/project/spark/jobs/order_streaming.py
    depends_on:
    - kafka